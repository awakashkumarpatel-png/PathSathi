name: Build Path Sathi APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate Complete Path Sathi App
      run: |
        # 1. Root settings.gradle.kts
        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "PathSathi"
        include(":app")
        EOF

        # 2. Root build.gradle.kts
        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.2.2" apply false
        }
        EOF

        # 3. Directories
        mkdir -p app/src/main/java/com/pathsathi/app
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/drawable

        # 4. App build.gradle.kts
        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
        }

        android {
            namespace = "com.pathsathi.app"
            compileSdk = 34

            defaultConfig {
                applicationId = "com.pathsathi.app"
                minSdk = 26
                targetSdk = 34
                versionCode = 1
                versionName = "1.0.0"
            }

            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
        }
        EOF

        # 5. AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
            <uses-permission android:name="android.permission.INTERNET" />

            <application
                android:allowBackup="true"
                android:label="Path Sathi"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.Material.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 6. MainActivity.java
        cat << 'EOF' > app/src/main/java/com/pathsathi/app/MainActivity.java
        package com.pathsathi.app;

        import android.app.Activity;
        import android.os.Bundle;
        import android.view.View;
        import android.widget.Button;
        import android.widget.Toast;

        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);

                Button btnSearch = findViewById(R.id.btnSearch);
                Button btnSos = findViewById(R.id.btnSos);

                if (btnSearch != null) {
                    btnSearch.setOnClickListener(new View.OnClickListener() {
                        @Override
                        public void onClick(View v) {
                            Toast.makeText(MainActivity.this, "Finding best routes for Path Sathi...", Toast.LENGTH_SHORT).show();
                        }
                    });
                }

                if (btnSos != null) {
                    btnSos.setOnClickListener(new View.OnClickListener() {
                        @Override
                        public void onClick(View v) {
                            Toast.makeText(MainActivity.this, "Emergency SOS Alert Triggered!", Toast.LENGTH_LONG).show();
                        }
                    });
                }
            }
        }
        EOF

        # 7. activity_main.xml (Rich Dashboard UI)
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:background="#F5F7FA"
            android:padding="16dp">

            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:orientation="vertical">

                <!-- Header -->
                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="Path Sathi 🚀"
                    android:textSize="28sp"
                    android:textStyle="bold"
                    android:textColor="#1E293B"
                    android:layout_marginBottom="4dp"/>

                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="Your Smart Travel & Safety Companion"
                    android:textSize="14sp"
                    android:textColor="#64748B"
                    android:layout_marginBottom="20dp"/>

                <!-- Search Route Box -->
                <LinearLayout
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:orientation="vertical"
                    android:background="#FFFFFF"
                    android:padding="16dp"
                    android:layout_marginBottom="20dp">

                    <EditText
                        android:id="@+id/etStart"
                        android:layout_width="match_parent"
                        android:layout_height="48dp"
                        android:hint="📍 Start Location (Current)"
                        android:padding="10dp"
                        android:layout_marginBottom="10dp"
                        android:background="#F1F5F9"/>

                    <EditText
                        android:id="@+id/etEnd"
                        android:layout_width="match_parent"
                        android:layout_height="48dp"
                        android:hint="🏁 Destination"
                        android:padding="10dp"
                        android:layout_marginBottom="12dp"
                        android:background="#F1F5F9"/>

                    <Button
                        android:id="@+id/btnSearch"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:text="Search Routes & Transport"
                        android:background="#2563EB"
                        android:textColor="#FFFFFF"/>
                </LinearLayout>

                <!-- Features Section -->
                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="Quick Services"
                    android:textSize="18sp"
                    android:textStyle="bold"
                    android:textColor="#1E293B"
                    android:layout_marginBottom="10dp"/>

                <Button
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:text="🚌 Bus Timings & Stops"
                    android:background="#059669"
                    android:textColor="#FFFFFF"
                    android:layout_marginBottom="10dp"/>

                <Button
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:text="🗺️ Live GPS Navigation"
                    android:background="#0284C7"
                    android:textColor="#FFFFFF"
                    android:layout_marginBottom="20dp"/>

                <!-- Emergency SOS Section -->
                <LinearLayout
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:orientation="vertical"
                    android:background="#FEF2F2"
                    android:padding="16dp">

                    <TextView
                        android:layout_width="wrap_content"
                        android:layout_height="wrap_content"
                        android:text="Safety First 🛡️"
                        android:textSize="16sp"
                        android:textStyle="bold"
                        android:textColor="#991B1B"
                        android:layout_marginBottom="4dp"/>

                    <TextView
                        android:layout_width="wrap_content"
                        android:layout_height="wrap_content"
                        android:text="Tap SOS in case of any emergency during travel."
                        android:textSize="12sp"
                        android:textColor="#7F1D1D"
                        android:layout_marginBottom="10dp"/>

                    <Button
                        android:id="@+id/btnSos"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:text="🚨 EMERGENCY SOS"
                        android:background="#DC2626"
                        android:textColor="#FFFFFF"
                        android:textStyle="bold"/>
                </LinearLayout>

            </LinearLayout>
        </ScrollView>
        EOF

        # 8. App Icon
        cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp"
            android:height="108dp"
            android:viewportWidth="108"
            android:viewportHeight="108">
            <path
                android:fillColor="#00E5FF"
                android:pathData="M54,18 L78,78 H30 L54,18 Z"/>
            <path
                android:fillColor="#00E676"
                android:pathData="M54,34 L70,78 H38 L54,34 Z"/>
        </vector>
        EOF

    - name: Generate Wrapper & Compile APK
      run: |
        gradle wrapper --gradle-version 8.2 --distribution-type bin
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: PathSathi-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
