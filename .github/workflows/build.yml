name: Build Path Sathi APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Project Structure & Icon
      run: |
        mkdir -p app/src/main/res/drawable
        cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp"
            android:height="108dp"
            android:viewportWidth="108"
            android:viewportHeight="108">
            <path
                android:fillColor="#00E5FF"
                android:pathData="M54,18 L78,78 H30 L54,18 Z"/>
            <path
                android:fillColor="#00E676"
                android:pathData="M54,34 L70,78 H38 L54,34 Z"/>
        </vector>
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace --no-daemon

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: PathSathi-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
