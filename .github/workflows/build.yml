name: Build Path Sathi APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Auto-Fix Paths & Setup App Icon
      run: |
        echo "Organizing files and icons..."
        mkdir -p app/src/main/java/com/pathsathi/app
        mkdir -p app/src/main/res/mipmap-hdpi
        mkdir -p app/src/main/res/drawable

        # Auto-fix Manifest and Activity
        MANIFEST_FILE=$(find app -name "AndroidManifest.xml" | head -n 1)
        if [ -n "$MANIFEST_FILE" ]; then
          cp "$MANIFEST_FILE" app/src/main/AndroidManifest.xml
        fi

        ACTIVITY_FILE=$(find app -name "MainActivity.kt" | head -n 1)
        if [ -n "$ACTIVITY_FILE" ]; then
          cp "$ACTIVITY_FILE" app/src/main/java/com/pathsathi/app/MainActivity.kt
        fi

        # Auto-detect uploaded logo image
        LOGO_FILE=$(find . -maxdepth 3 \( -name "*logo*.png" -o -name "*icon*.png" -o -name "ic_launcher.png" -o -name "*.png" \) | grep -v "gradle" | head -n 1)
        if [ -n "$LOGO_FILE" ]; then
          echo "Found logo image at $LOGO_FILE, setting as App Icon..."
          cp "$LOGO_FILE" app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp "$LOGO_FILE" app/src/main/res/drawable/ic_launcher.png
        fi

    - name: Generate Wrapper & Build APK
      run: |
        gradle wrapper --gradle-version 8.4
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: PathSathi-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
