name: Build PathSathi APK

# Runs on every push/PR to main, and can also be triggered manually from the
# Actions tab (Run workflow button) - useful for a one-off build without a
# code change. GitHub's runners have a real JDK, real internet access, and
# apt/Android SDK availability - none of which exist in the sandbox this
# project was developed in, so this is the actual first real build+test of
# this project, not another round of manual code review.
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Verify Gradle Wrapper
        run: |
          test -f gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK/AAB
        # Uses this project's existing signingConfig, which automatically
        # falls back to debug signing when gradle/keystore.properties isn't
        # present (see app/build.gradle) - so this succeeds even without a
        # real upload keystore configured, producing a test-signed release
        # build. Add a real keystore + GitHub Secrets later before
        # publishing to the Play Store.
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pathsathi-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: pathsathi-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload release AAB (for Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: pathsathi-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
