name: Build Path Sathi APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Auto-Fix Duplicate Folder Paths
      run: |
        echo "Fixing structure..."
        mkdir -p app/src/main/java/com/pathsathi/app
        
        # Find and move AndroidManifest.xml to correct location
        MANIFEST_FILE=$(find app -name "AndroidManifest.xml" | head -n 1)
        if [ -n "$MANIFEST_FILE" ]; then
          cp "$MANIFEST_FILE" app/src/main/AndroidManifest.xml
        fi
        
        # Find and move MainActivity.kt to correct location
        ACTIVITY_FILE=$(find app -name "MainActivity.kt" | head -n 1)
        if [ -n "$ACTIVITY_FILE" ]; then
          cp "$ACTIVITY_FILE" app/src/main/java/com/pathsathi/app/MainActivity.kt
        fi

    - name: Generate Wrapper & Build APK
      run: |
        gradle wrapper --gradle-version 8.4
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: PathSathi-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
