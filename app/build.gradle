plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.pathsathi.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.pathsathi.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Release signing reads from gradle/keystore.properties (NOT committed to
    // version control - see gradle/keystore.properties.template). If that
    // file is missing, the release build type simply falls back to signing
    // with the Android debug key so `./gradlew assembleRelease` still
    // produces an installable (test-only) APK instead of failing outright.
    // Replace it with a real upload keystore before publishing.
    def keystorePropsFile = rootProject.file("gradle/keystore.properties")
    def keystoreProps = new Properties()
    def hasReleaseKeystore = keystorePropsFile.exists()
    if (hasReleaseKeystore) {
        keystoreProps.load(new FileInputStream(keystorePropsFile))
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ['-opt-in=androidx.compose.material3.ExperimentalMaterial3Api', '-opt-in=androidx.compose.foundation.ExperimentalFoundationApi']
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'

    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'

    // Networking (for automatic weather fetch)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.json:json:20231013'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Location
    implementation 'com.google.android.gms:play-services-location:21.1.0'

    // Local persistence
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.datastore:datastore-preferences:1.0.0'

    // Real interactive map - OpenStreetMap based, no API key required,
    // supports offline tile caching (osmdroid.tileCache)
    implementation 'org.osmdroid:osmdroid-android:6.1.18'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
